services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    image: ministackorg/ministack:1.4.8
    ports:
      - "4566:4566"

  sqs-init:
    image: amazon/aws-cli:2.22.0
    depends_on:
      - sqs
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT: http://sqs:4566
    entrypoint: ["/bin/sh", "/scripts/create-queues.sh"]
    volumes:
      - ./docker/sqs/create-queues.sh:/scripts/create-queues.sh:ro
    restart: "no"
